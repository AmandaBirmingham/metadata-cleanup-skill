<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 86 662 236" width="662" height="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" role="img" aria-label="How a session works">
  <style>
    .node { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .exit { fill: #fff8e5; stroke: #9a6700; stroke-width: 1.2; }
    .txt  { fill: #1f2328; text-anchor: middle; }
    .lbl  { fill: #57606a; font-size: 10; text-anchor: middle; font-style: italic; }
    .edge { stroke: #57606a; stroke-width: 1.2; fill: none; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #161b22; stroke: #8b949e; }
      .exit { fill: #2b2111; stroke: #d29922; }
      .txt  { fill: #e6edf3; }
      .lbl  { fill: #8b949e; }
      .edge { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <path class="edge" d="M104,132 H120" marker-end="url(#arr)"/>
  <path class="edge" d="M218,132 H234" marker-end="url(#arr)"/>
  <path class="edge" d="M332,132 H348" marker-end="url(#arr)"/>
  <path class="edge" d="M426,132 H442" marker-end="url(#arr)"/>
  <text class="lbl" x="435" y="125">no</text>
  <path class="edge" d="M540,132 H556" marker-end="url(#arr)"/>
  <path class="edge" d="M388,170 V186 H128 V202" marker-end="url(#arr)"/>
  <text class="lbl" x="402" y="183">yes</text>
  <path class="edge" d="M606,168 V202" marker-end="url(#arr)"/>
  <path class="edge" d="M558,240 H542" marker-end="url(#arr)"/>
  <path class="edge" d="M444,240 H428" marker-end="url(#arr)"/>
  <path class="edge" d="M330,240 H292" marker-end="url(#arr)"/>
  <text class="lbl" x="310" y="233">done</text>
  <path class="edge" d="M194,240 H178" marker-end="url(#arr)"/>
  <path class="edge" d="M378,276 V300 H606 V278" marker-end="url(#arr)"/>
  <text class="lbl" x="492" y="314">more findings</text>
  <rect class="node" x="8" y="96" width="96" height="72" rx="6"/>
  <text class="txt" x="56" y="129">Explain the</text>
  <text class="txt" x="56" y="143">session</text>
  <rect class="node" x="122" y="96" width="96" height="72" rx="6"/>
  <text class="txt" x="170" y="129">Discuss the</text>
  <text class="txt" x="170" y="143">study</text>
  <rect class="node" x="236" y="96" width="96" height="72" rx="6"/>
  <text class="txt" x="284" y="122">Mechanically</text>
  <text class="txt" x="284" y="136">find and</text>
  <text class="txt" x="284" y="150">resolve PII</text>
  <path class="node" d="M388,94 L426,132 L388,170 L350,132 z"/>
  <text class="txt" x="388" y="129">PII</text>
  <text class="txt" x="388" y="143">removed?</text>
  <rect class="node" x="444" y="96" width="96" height="72" rx="6"/>
  <text class="txt" x="492" y="129">Profile</text>
  <text class="txt" x="492" y="143">inputs</text>
  <rect class="node" x="558" y="96" width="96" height="72" rx="6"/>
  <text class="txt" x="606" y="129">Run judgment</text>
  <text class="txt" x="606" y="143">checks</text>
  <rect class="node" x="558" y="204" width="96" height="72" rx="6"/>
  <text class="txt" x="606" y="230">Discuss findings</text>
  <text class="txt" x="606" y="244">&amp; propose</text>
  <text class="txt" x="606" y="258">changes</text>
  <rect class="node" x="444" y="204" width="96" height="72" rx="6"/>
  <text class="txt" x="492" y="223">Show diff;</text>
  <text class="txt" x="492" y="237">scientist</text>
  <text class="txt" x="492" y="251">approves or</text>
  <text class="txt" x="492" y="265">rejects</text>
  <rect class="node" x="330" y="204" width="96" height="72" rx="6"/>
  <text class="txt" x="378" y="230">Update decision</text>
  <text class="txt" x="378" y="244">log &amp; cleanup</text>
  <text class="txt" x="378" y="258">script</text>
  <rect class="node" x="194" y="204" width="96" height="72" rx="6"/>
  <text class="txt" x="242" y="230">Merge tables</text>
  <text class="txt" x="242" y="244">(if several)</text>
  <text class="txt" x="242" y="258">then validate</text>
  <rect class="exit" x="80" y="204" width="96" height="72" rx="6"/>
  <text class="txt" x="128" y="230">Run final</text>
  <text class="txt" x="128" y="244">script &amp; deliver</text>
  <text class="txt" x="128" y="258">outputs</text>
</svg>
